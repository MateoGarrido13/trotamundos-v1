# Bases de viajes del prototipo (Tier 3). Dos instancias físicamente separadas:
# la primaria y la pasiva (ADR-IT2-004 / ADR-IT2-005).
# max_prepared_transactions > 0 es necesario para el commit en dos fases (PREPARE TRANSACTION).
# Las bases de cuentas (3 regiones x 2, SPEC-COMP-05) y la analítica se agregan con sus slices.
x-postgres: &postgres
  image: postgres:16
  restart: unless-stopped
  command: ["postgres", "-c", "max_prepared_transactions=20"]

services:
  viajes_primaria:
    <<: *postgres
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: viajes_primaria
    ports: ["5433:5432"]
    volumes: ["viajes_primaria_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d viajes_primaria"]
      interval: 3s
      retries: 20

  viajes_pasiva:
    <<: *postgres
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: viajes_pasiva
    ports: ["5434:5432"]
    volumes: ["viajes_pasiva_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d viajes_pasiva"]
      interval: 3s
      retries: 20

  # Base analítica (SPEC-REF-06): instancia propia, distinta de las bases de viajes. No necesita
  # transacciones preparadas: el Proyector escribe con una transacción común.
  analitica:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: analitica
    ports: ["5435:5432"]
    volumes: ["analitica_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d analitica"]
      interval: 3s
      retries: 20

  # Base de cuentas de la región amer (SPEC-COMP-05, ADR-IT4-001). Commit en dos fases dentro de la región.
  cuentas_amer_primaria:
    <<: *postgres
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: cuentas_amer_primaria
    ports: ["5436:5432"]
    volumes: ["cuentas_amer_primaria_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d cuentas_amer_primaria"]
      interval: 3s
      retries: 20

  # Base de cuentas de la región amer (SPEC-COMP-05, ADR-IT4-001). Commit en dos fases dentro de la región.
  cuentas_amer_pasiva:
    <<: *postgres
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: cuentas_amer_pasiva
    ports: ["5437:5432"]
    volumes: ["cuentas_amer_pasiva_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d cuentas_amer_pasiva"]
      interval: 3s
      retries: 20

  # Base de cuentas de la región emea (SPEC-COMP-05, ADR-IT4-001). Commit en dos fases dentro de la región.
  cuentas_emea_primaria:
    <<: *postgres
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: cuentas_emea_primaria
    ports: ["5438:5432"]
    volumes: ["cuentas_emea_primaria_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d cuentas_emea_primaria"]
      interval: 3s
      retries: 20

  # Base de cuentas de la región emea (SPEC-COMP-05, ADR-IT4-001). Commit en dos fases dentro de la región.
  cuentas_emea_pasiva:
    <<: *postgres
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: cuentas_emea_pasiva
    ports: ["5439:5432"]
    volumes: ["cuentas_emea_pasiva_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d cuentas_emea_pasiva"]
      interval: 3s
      retries: 20

  # Base de cuentas de la región apac (SPEC-COMP-05, ADR-IT4-001). Commit en dos fases dentro de la región.
  cuentas_apac_primaria:
    <<: *postgres
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: cuentas_apac_primaria
    ports: ["5440:5432"]
    volumes: ["cuentas_apac_primaria_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d cuentas_apac_primaria"]
      interval: 3s
      retries: 20

  # Base de cuentas de la región apac (SPEC-COMP-05, ADR-IT4-001). Commit en dos fases dentro de la región.
  cuentas_apac_pasiva:
    <<: *postgres
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: cuentas_apac_pasiva
    ports: ["5441:5432"]
    volumes: ["cuentas_apac_pasiva_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d cuentas_apac_pasiva"]
      interval: 3s
      retries: 20

volumes:
  viajes_primaria_data:
  viajes_pasiva_data:
  analitica_data:
  cuentas_amer_primaria_data:
  cuentas_amer_pasiva_data:
  cuentas_emea_primaria_data:
  cuentas_emea_pasiva_data:
  cuentas_apac_primaria_data:
  cuentas_apac_pasiva_data:
